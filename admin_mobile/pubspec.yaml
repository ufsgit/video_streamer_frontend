name: admin_mobile
description: "CarePulse Admin Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  dio: ^5.11.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.5
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_transparent.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/

