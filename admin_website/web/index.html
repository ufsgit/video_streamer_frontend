<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="CarePulse Admin Portal - Clinical Dashboard & Patient Management">
  <meta name="theme-color" content="#0F3D81">

  <!-- Preconnect & DNS-Prefetch for faster connection handshakes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://b52kcl7t-3000.inc1.devtunnels.ms" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://b52kcl7t-3000.inc1.devtunnels.ms">

  <!-- Preload Inter Font to eliminate layout blocking & reduce TBT -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  </noscript>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CarePulse Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CarePulse Admin Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Instant CSS Splash for sub-second First Contentful Paint (FCP) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #F8FAFC;
    }
    #app-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      z-index: 999999;
      transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
      pointer-events: none;
    }
    .splash-logo-card {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0F3D81, #2563EB);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px -6px rgba(37, 99, 235, 0.45);
      margin-bottom: 22px;
    }
    .splash-logo-card svg {
      width: 36px;
      height: 36px;
      fill: #FFFFFF;
    }
    .splash-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .splash-subtitle {
      font-size: 13px;
      color: #94A3B8;
      font-weight: 400;
      margin-bottom: 26px;
    }
    .splash-loader-bar {
      width: 150px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .splash-loader-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #3B82F6, #60A5FA);
      border-radius: 99px;
      animation: pulse-line 1.3s infinite ease-in-out;
    }
    @keyframes pulse-line {
      0% { left: -40%; width: 40%; }
      50% { left: 35%; width: 55%; }
      100% { left: 100%; width: 40%; }
    }
    .splash-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
    }
  </style>
</head>
<body>
  <!-- Instant HTML/CSS Splash Element -->
  <div id="app-splash" aria-label="Loading CarePulse Portal">
    <div class="splash-logo-card">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
      </svg>
    </div>
    <div class="splash-title">CarePulse Admin</div>
    <div class="splash-subtitle">Initializing Secure Portal...</div>
    <div class="splash-loader-bar"></div>
  </div>

  <script>
    function dismissSplash() {
      const splash = document.getElementById('app-splash');
      if (splash && !splash.classList.contains('splash-hidden')) {
        splash.classList.add('splash-hidden');
        setTimeout(() => splash.remove(), 400);
      }
    }

    // Dismiss as soon as Flutter renders the first frame
    window.addEventListener('flutter-first-frame', dismissSplash);

    // Fallback: observer for when flutter web canvas/view is added
    const domObserver = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        dismissSplash();
        obs.disconnect();
      }
    });
    domObserver.observe(document.body, { childList: true, subtree: true });

    // Safety timeout: dismiss after 8 seconds at most
    setTimeout(dismissSplash, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
